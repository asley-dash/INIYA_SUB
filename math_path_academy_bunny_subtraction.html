<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Math Path Academy - Bunny Subtraction</title>

  <!-- Google Fonts: Fredoka -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Confetti Celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      font-family: 'Fredoka', cursive, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #F0FDF4 0%, #ECFCCB 45%, #FEF9C3 100%);
      min-height: 100vh;
    }

    .key-btn {
      transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 0 #EA580C;
    }
    .key-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #EA580C;
    }

    .action-btn {
      transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .action-btn:active {
      transform: translateY(3px);
    }

    .ans-box {
      caret-color: transparent;
      transition: all 0.15s ease;
    }
    .ans-box.active-col {
      border-color: #F97316 !important;
      background-color: #FFEDD5 !important;
      box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.3);
      transform: scale(1.05);
    }

    .bunny-hop {
      animation: hopAnim 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes hopAnim {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.15); }
    }

    .wiggle-wrong {
      animation: wiggleAnim 0.35s ease-in-out;
    }
    @keyframes wiggleAnim {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    .pulse-glow {
      animation: glowAnim 1.4s infinite alternate ease-in-out;
    }
    @keyframes glowAnim {
      from { box-shadow: 0 0 8px rgba(249, 115, 22, 0.4); }
      to { box-shadow: 0 0 20px rgba(234, 88, 12, 0.8); }
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between p-3 sm:p-4 max-w-sm mx-auto">

  <!-- Header Bar -->
  <header class="w-full flex items-center justify-between pt-1 pb-1">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-2xl bg-orange-400 flex items-center justify-center text-lg shadow-sm border border-orange-200">
        🥕
      </div>
      <div>
        <h1 class="text-sm font-extrabold text-stone-800 leading-none">Math Path Academy</h1>
        <p class="text-[11px] font-bold text-orange-600">Bunny Subtraction</p>
      </div>
    </div>

    <!-- Carrot Score & Streak Counter -->
    <div class="flex items-center gap-2">
      <div class="flex items-center gap-1 bg-white/90 border-2 border-orange-200 px-2.5 py-1 rounded-2xl shadow-xs">
        <span class="text-lg">🥕</span>
        <span id="carrot-count" class="font-black text-orange-950 text-base leading-none">0</span>
      </div>
      <div id="streak-pill" class="flex items-center gap-1 bg-amber-100 border-2 border-amber-300 px-2.5 py-1 rounded-2xl text-xs font-black text-amber-900 shadow-xs">
        <span>🔥</span>
        <span id="streak-count">0</span>
      </div>
    </div>
  </header>

  <!-- Bunny Companion Dialogue -->
  <div class="flex items-center justify-center gap-3 my-1">
    <div id="bunny-face" class="text-5xl cursor-pointer transition-transform" onclick="hopBunny()">
      🐰
    </div>
    <div id="bunny-speech" class="bg-white border-2 border-orange-200 px-3.5 py-1.5 rounded-2xl shadow-xs font-bold text-stone-700 text-xs sm:text-sm">
      Let's subtract! Start with Ones 👉
    </div>
  </div>

  <!-- Column Subtraction Board -->
  <main class="w-full bg-white rounded-3xl p-4 shadow-md border-3 border-emerald-100 flex flex-col items-center my-1" id="board">
    
    <!-- Optional Super Bunny Mode Badge (Hidden until streak 15) -->
    <div id="super-badge" class="hidden text-[11px] font-extrabold text-amber-900 bg-amber-200 border border-amber-400 px-3 py-0.5 rounded-full mb-1">
      ✨ Super Bunny 3-Digit Mode! ✨
    </div>

    <!-- Column Headers (H, T, O) -->
    <div class="grid grid-cols-4 gap-2 w-full max-w-[260px] text-center mb-1">
      <div></div>
      <!-- Hundreds (Shown if 3 digits active) -->
      <div id="col-head-h" class="invisible font-black text-xs text-sky-600 bg-sky-50 py-0.5 rounded-xl">H</div>
      <div class="font-black text-xs text-emerald-600 bg-emerald-50 py-0.5 rounded-xl">T</div>
      <div class="font-black text-xs text-orange-600 bg-orange-50 py-0.5 rounded-xl">O</div>
    </div>

    <!-- Top Number (Larger) -->
    <div class="grid grid-cols-4 gap-2 w-full max-w-[260px] text-center items-center my-0.5">
      <div></div>
      <div id="n1-h" class="text-3xl sm:text-4xl font-black text-stone-800"></div>
      <div id="n1-t" class="text-3xl sm:text-4xl font-black text-stone-800">5</div>
      <div id="n1-o" class="text-3xl sm:text-4xl font-black text-stone-800">8</div>
    </div>

    <!-- Bottom Number (Smaller) -->
    <div class="grid grid-cols-4 gap-2 w-full max-w-[260px] text-center items-center my-0.5">
      <div class="text-3xl font-black text-orange-500 text-center leading-none">−</div>
      <div id="n2-h" class="text-3xl sm:text-4xl font-black text-stone-800"></div>
      <div id="n2-t" class="text-3xl sm:text-4xl font-black text-stone-800">2</div>
      <div id="n2-o" class="text-3xl sm:text-4xl font-black text-stone-800">3</div>
    </div>

    <!-- Divider Bar -->
    <div class="w-full max-w-[260px] h-1.5 bg-stone-800 rounded-full my-1.5"></div>

    <!-- Answer Boxes -->
    <div class="grid grid-cols-4 gap-2 w-full max-w-[260px] text-center items-center">
      <div class="text-xl font-bold text-orange-400">=</div>

      <!-- Hundreds answer slot -->
      <button onclick="setFocusCol('h')" id="box-h" class="invisible ans-box h-14 rounded-2xl border-2 border-stone-200 bg-stone-50 font-black text-2xl text-stone-800 flex items-center justify-center">
      </button>

      <!-- Tens answer slot -->
      <button onclick="setFocusCol('t')" id="box-t" class="ans-box h-14 rounded-2xl border-2 border-stone-200 bg-stone-50 font-black text-2xl text-stone-800 flex items-center justify-center">
      </button>

      <!-- Ones answer slot -->
      <button onclick="setFocusCol('o')" id="box-o" class="ans-box active-col h-14 rounded-2xl border-2 border-stone-200 bg-stone-50 font-black text-2xl text-stone-800 flex items-center justify-center">
      </button>
    </div>

    <div class="w-full max-w-[260px] h-1.5 bg-stone-800 rounded-full my-1.5"></div>
  </main>

  <!-- Kid Touch Keypad -->
  <section class="w-full bg-white/80 rounded-3xl p-2.5 border-2 border-orange-200 flex flex-col gap-1.5 mt-1 shadow-sm">
    <!-- Numbers Row 1 -->
    <div class="grid grid-cols-5 gap-1.5">
      <button onclick="tapKey('1')" class="key-btn h-11 rounded-xl bg-orange-50 border-2 border-orange-300 font-extrabold text-xl text-stone-800">1</button>
      <button onclick="tapKey('2')" class="key-btn h-11 rounded-xl bg-orange-50 border-2 border-orange-300 font-extrabold text-xl text-stone-800">2</button>
      <button onclick="tapKey('3')" class="key-btn h-11 rounded-xl bg-orange-50 border-2 border-orange-300 font-extrabold text-xl text-stone-800">3</button>
      <button onclick="tapKey('4')" class="key-btn h-11 rounded-xl bg-orange-50 border-2 border-orange-300 font-extrabold text-xl text-stone-800">4</button>
      <button onclick="tapKey('5')" class="key-btn h-11 rounded-xl bg-orange-50 border-2 border-orange-300 font-extrabold text-xl text-stone-800">5</button>
    </div>

    <!-- Numbers Row 2 -->
    <div class="grid grid-cols-5 gap-1.5">
      <button onclick="tapKey('6')" class="key-btn h-11 rounded-xl bg-orange-50 border-2 border-orange-300 font-extrabold text-xl text-stone-800">6</button>
      <button onclick="tapKey('7')" class="key-btn h-11 rounded-xl bg-orange-50 border-2 border-orange-300 font-extrabold text-xl text-stone-800">7</button>
      <button onclick="tapKey('8')" class="key-btn h-11 rounded-xl bg-orange-50 border-2 border-orange-300 font-extrabold text-xl text-stone-800">8</button>
      <button onclick="tapKey('9')" class="key-btn h-11 rounded-xl bg-orange-50 border-2 border-orange-300 font-extrabold text-xl text-stone-800">9</button>
      <button onclick="tapKey('0')" class="key-btn h-11 rounded-xl bg-orange-50 border-2 border-orange-300 font-extrabold text-xl text-stone-800">0</button>
    </div>

    <!-- Actions Row -->
    <div class="grid grid-cols-4 gap-1.5 pt-0.5">
      <button onclick="eraseKey()" class="action-btn h-12 col-span-1 rounded-xl bg-rose-100 border-2 border-rose-300 text-rose-700 font-black text-xl flex items-center justify-center">
        ⌫
      </button>
      <button onclick="checkResult()" class="action-btn h-12 col-span-3 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold text-lg flex items-center justify-center gap-1.5 shadow-[0_3px_0_#059669]">
        <span>Check 🥕</span>
      </button>
    </div>
  </section>

  <!-- Easter Egg Modal: 15 Streak Unlocked -->
  <div id="streak-modal" class="hidden fixed inset-0 bg-stone-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-5 border-4 border-amber-400 max-w-xs w-full text-center shadow-2xl flex flex-col items-center gap-3">
      <div class="text-6xl animate-bounce">🥕👑</div>
      <h2 class="text-2xl font-black text-amber-900">Golden Carrot!</h2>
      <p class="text-sm font-bold text-stone-600">
        Wow! 15 correct in a row!<br/>You unlocked the <span class="text-orange-600 font-black">Super 3-Digit Bunny Challenge</span>!
      </p>
      <button onclick="dismissEasterEgg()" class="action-btn w-full py-3 bg-gradient-to-r from-amber-500 to-orange-500 text-white font-extrabold text-lg rounded-2xl shadow-[0_4px_0_#C2410C]">
        Let's Go! 🐰
      </button>
    </div>
  </div>

  <script>
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function soundTap() {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(480, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(720, ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.04);
        osc.start();
        osc.stop(ctx.currentTime + 0.04);
      } catch(e) {}
    }

    function soundCrunch() {
      try {
        const ctx = getAudio();
        // Cheerful bunny carrot crunch / victory chime
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.07);
          gain.gain.setValueAtTime(0.18, ctx.currentTime + idx * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.07 + 0.22);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.07);
          osc.stop(ctx.currentTime + idx * 0.07 + 0.22);
        });
      } catch(e) {}
    }

    function soundFanfare() {
      try {
        const ctx = getAudio();
        const notes = [392, 523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
          gain.gain.setValueAtTime(0.22, ctx.currentTime + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.1 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.1);
          osc.stop(ctx.currentTime + idx * 0.1 + 0.35);
        });
      } catch(e) {}
    }

    function soundTryAgain() {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(260, ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(180, ctx.currentTime + 0.14);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.14);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.14);
      } catch(e) {}
    }
  </script>

  <script>
    let num1 = 0;
    let num2 = 0;
    let carrots = 0;
    let streak = 0;
    let activeCol = 'o'; // 'o' | 't' | 'h'
    let isLocked = false;
    let hasUnlockedThreeDigits = false;
    let isCurrentThreeDigit = false;

    const bunnyFaces = ['🐰', '🐇', '🥕', '✨', '🐾'];

    function setBubble(text) {
      document.getElementById('bunny-speech').textContent = text;
    }

    function hopBunny() {
      soundTap();
      const b = document.getElementById('bunny-face');
      b.classList.add('bunny-hop');
      setTimeout(() => b.classList.remove('bunny-hop'), 500);
    }

    function setFocusCol(col) {
      if (col === 'h' && !isCurrentThreeDigit) return;
      soundTap();
      activeCol = col;
      ['h', 't', 'o'].forEach(c => {
        const el = document.getElementById(`box-${c}`);
        if (c === col) {
          el.classList.add('active-col');
        } else {
          el.classList.remove('active-col');
        }
      });
    }

    function generateProblem() {
      isLocked = false;

      // Easter Egg: If child reached 15 streak, introduce 3-digit subtraction
      isCurrentThreeDigit = (streak >= 15 || hasUnlockedThreeDigits) && Math.random() > 0.3;

      if (isCurrentThreeDigit) {
        // 3-digit minus 2-digit or 3-digit minus 3-digit
        num1 = Math.floor(Math.random() * 550) + 150; // 150 to 699
        num2 = Math.floor(Math.random() * (num1 - 25)) + 15; // smaller than num1
      } else {
        // Standard 2-digit subtraction (results >= 0)
        num1 = Math.floor(Math.random() * 70) + 25; // 25 to 94
        num2 = Math.floor(Math.random() * (num1 - 10)) + 11; // 11 up to num1 - 10
      }

      const s1 = String(num1);
      const s2 = String(num2);

      // Hundreds Visibility
      const colHeadH = document.getElementById('col-head-h');
      const boxH = document.getElementById('box-h');
      const n1H = document.getElementById('n1-h');
      const n2H = document.getElementById('n2-h');

      if (isCurrentThreeDigit) {
        colHeadH.classList.remove('invisible');
        boxH.classList.remove('invisible');
        document.getElementById('super-badge').classList.remove('hidden');
      } else {
        colHeadH.classList.add('invisible');
        boxH.classList.add('invisible');
        document.getElementById('super-badge').classList.add('hidden');
      }

      n1H.textContent = s1.length >= 3 ? s1[s1.length - 3] : '';
      document.getElementById('n1-t').textContent = s1.length >= 2 ? s1[s1.length - 2] : '0';
      document.getElementById('n1-o').textContent = s1[s1.length - 1];

      n2H.textContent = s2.length >= 3 ? s2[s2.length - 3] : '';
      document.getElementById('n2-t').textContent = s2.length >= 2 ? s2[s2.length - 2] : '0';
      document.getElementById('n2-o').textContent = s2[s2.length - 1];

      // Clear answer boxes
      document.getElementById('box-h').textContent = '';
      document.getElementById('box-t').textContent = '';
      document.getElementById('box-o').textContent = '';

      setFocusCol('o');
      setBubble('Subtract the Ones first! 🥕');

      document.getElementById('bunny-face').textContent = '🐰';
    }

    function tapKey(digit) {
      if (isLocked) return;
      soundTap();

      const curBox = document.getElementById(`box-${activeCol}`);
      curBox.textContent = digit;

      // Natural flow for subtraction: Ones -> Tens -> Hundreds
      if (activeCol === 'o') {
        setFocusCol('t');
        setBubble('Now subtract Tens! 🥕');
      } else if (activeCol === 't') {
        if (isCurrentThreeDigit) {
          setFocusCol('h');
          setBubble('Now Hundreds! 🥕');
        }
      }
    }

    function eraseKey() {
      if (isLocked) return;
      soundTap();
      document.getElementById(`box-${activeCol}`).textContent = '';
    }

    function dismissEasterEgg() {
      document.getElementById('streak-modal').classList.add('hidden');
      generateProblem();
    }

    function checkResult() {
      if (isLocked) return;

      const oVal = document.getElementById('box-o').textContent.trim();
      const tVal = document.getElementById('box-t').textContent.trim();
      const hVal = document.getElementById('box-h').textContent.trim();

      if (oVal === '') {
        soundTryAgain();
        setBubble('Fill in your answer first! 🥕');
        setFocusCol('o');
        return;
      }

      let childStr = '';
      if (isCurrentThreeDigit && hVal !== '') {
        childStr += hVal;
      }
      childStr += (tVal || '0') + oVal;

      const childTotal = parseInt(childStr, 10);
      const target = num1 - num2;

      const bunny = document.getElementById('bunny-face');
      const board = document.getElementById('board');

      if (childTotal === target) {
        // Correct Answer
        isLocked = true;
        carrots += 1;
        streak += 1;
        document.getElementById('carrot-count').textContent = carrots;
        document.getElementById('streak-count').textContent = streak;

        bunny.textContent = '🥳';
        hopBunny();

        // Check for 15 Streak Easter Egg trigger
        if (streak === 15 && !hasUnlockedThreeDigits) {
          hasUnlockedThreeDigits = true;
          soundFanfare();
          if (typeof confetti === 'function') {
            confetti({ particleCount: 100, spread: 80, origin: { y: 0.5 } });
          }
          setTimeout(() => {
            document.getElementById('streak-modal').classList.remove('hidden');
          }, 600);
          return;
        }

        soundCrunch();
        setBubble('Yum! Crunch crunch! 🥕');

        if (typeof confetti === 'function') {
          confetti({ particleCount: 30, spread: 45, origin: { y: 0.6 } });
        }

        setTimeout(() => {
          generateProblem();
        }, 1300);

      } else {
        // Incorrect Answer
        soundTryAgain();
        streak = 0; // reset streak
        document.getElementById('streak-count').textContent = '0';

        board.classList.add('wiggle-wrong');
        setTimeout(() => board.classList.remove('wiggle-wrong'), 380);

        bunny.textContent = '🥺';
        setBubble('Try again, little bunny! 🥕');
      }
    }

    window.addEventListener('load', () => {
      generateProblem();
    });
  </script>
</body>
</html>
